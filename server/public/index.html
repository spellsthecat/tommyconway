<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Conway Sales HQ</title>
<meta name="description" content="Private sales command center for Tommy Conway." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
<!-- Installable app (Add to Home Screen) -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#3f6151" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Conway HQ" />
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --ink:#1c2128; --muted:#656d78;
    --faint:#8a93a0; --line:#e7e9ee; --line-strong:#d9dce3;
    --accent:#3f6151; --accent-ink:#2c4639; --accent-soft:#e8efe9;
    --blue:#2f6fb0; --amber:#b8860b; --rose:#b5485d; --violet:#6d5ab6; --teal:#2f8f87;
    --good:#2e7d55; --warn:#b4810f; --bad:#c0394f;
    --shadow:0 1px 2px rgba(28,33,40,.05), 0 10px 30px -18px rgba(28,33,40,.28);
    --shadow-lg:0 24px 60px -24px rgba(28,33,40,.4);
    --r:14px; --r-sm:10px;
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --surface:#171a20; --surface-2:#1c2027; --ink:#e9edf2; --muted:#9aa3af;
    --faint:#6f7784; --line:#272c34; --line-strong:#333a44;
    --accent:#72a088; --accent-ink:#bfe0d1; --accent-soft:#1f2a24;
    --blue:#6ba6df; --amber:#d8b25a; --rose:#dd8294; --violet:#a594e0; --teal:#5fb8b0;
    --good:#5bbd88; --warn:#e0b65c; --bad:#e67585;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.7);
    --shadow-lg:0 30px 70px -28px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.5;
  }
  a{color:inherit}
  button{font-family:inherit}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100dvh}
  .scrim{display:none}

  /* Sidebar */
  .side{
    background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
  .brand .logo{
    width:36px;height:36px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em;
    box-shadow:0 6px 16px -8px var(--accent);
  }
  .brand b{font-size:15px;display:block;line-height:1.15}
  .brand span{font-size:11.5px;color:var(--muted)}
  nav{padding:6px 10px;overflow-y:auto;flex:1}
  .nav-group{margin:10px 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--faint);font-weight:600}
  .nav-item{
    display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--muted);
    text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14px;margin:1px 0;transition:.12s;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .nav-item .ic{width:17px;height:17px;flex:0 0 auto;opacity:.9}
  .nav-item .badge{margin-left:auto;font-size:11px;background:var(--line);color:var(--muted);border-radius:999px;padding:1px 7px}
  .side-foot{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .side-foot .who{font-size:12px;line-height:1.3}
  .side-foot .who b{font-size:12.5px}
  .side-foot .who span{color:var(--muted)}
  .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--line)}
  .theme-btn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}

  /* Main */
  main{min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:13px clamp(16px,3vw,30px);
  }
  .topbar h1{font-size:18px;margin:0;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .spacer{flex:1}
  .view{padding:clamp(16px,3vw,30px);max-width:1180px;width:100%}
  .hamb{display:none}

  /* Buttons / inputs */
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.12s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--muted);background:var(--surface-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:7px 9px}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.sm{padding:5px 9px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;width:100%;transition:.12s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:80px;line-height:1.55}
  label.fld{display:block;margin:0 0 12px}
  label.fld .lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row > *{flex:1;min-width:140px}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}
  .card-h h3{margin:0;font-size:14.5px}
  .card-b{padding:17px}
  .grid{display:grid;gap:16px}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
  .kpi .k-lab{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
  .kpi .k-val{font-size:27px;font-weight:650;letter-spacing:-.02em;margin-top:7px;line-height:1}
  .kpi .k-sub{font-size:11.5px;color:var(--faint);margin-top:6px}
  .kpi .k-sub .up{color:var(--good)} .kpi .k-sub .down{color:var(--bad)}

  /* Bars (single-hue magnitude) */
  .bars{display:flex;flex-direction:column;gap:11px}
  .bar-row{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:12px;font-size:13px}
  .bar-row .bl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .bar-fill{height:100%;border-radius:999px;background:var(--accent);min-width:3px}
  .bar-row .bv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

  /* Table */
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;white-space:nowrap}
  tbody tr:hover{background:var(--surface-2)}
  td .mini{color:var(--muted);font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
  .chip.gray{background:var(--line);color:var(--muted)}
  .chip.green{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
  .chip.blue{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
  .chip.amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
  .chip.rose{background:color-mix(in srgb,var(--rose) 16%,transparent);color:var(--rose)}
  .chip.violet{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
  .rowacts{display:flex;gap:4px;justify-content:flex-end;opacity:.4;transition:.12s}
  tr:hover .rowacts{opacity:1}
  .iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:7px;line-height:0}
  .iconbtn:hover{background:var(--line);color:var(--ink)}
  .iconbtn.danger:hover{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

  /* Empty / loading */
  .empty{text-align:center;padding:46px 20px;color:var(--muted)}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.5}
  .skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .sechead{display:flex;align-items:center;gap:12px;margin:0 0 15px}
  .sechead h2{font-size:16px;margin:0}
  .sechead .spacer{flex:1}

  /* Modal */
  .ovl{position:fixed;inset:0;background:rgba(10,12,16,.46);backdrop-filter:blur(2px);display:grid;place-items:center;padding:18px;z-index:60;opacity:0;pointer-events:none;transition:.15s}
  .ovl.open{opacity:1;pointer-events:auto}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:88dvh;overflow:auto;transform:translateY(8px);transition:.15s}
  .ovl.open .modal{transform:none}
  .modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
  .modal-h h3{margin:0;font-size:15.5px} .modal-b{padding:18px}
  .modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}

  /* Chat / AI */
  .ai-wrap{display:flex;flex-direction:column;height:calc(100dvh - 128px);min-height:420px}
  .ai-stream{flex:1;overflow-y:auto;padding:4px 2px 14px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:11px;max-width:92%}
  .msg .b{padding:11px 14px;border-radius:13px;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg.user .b{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.ai .b{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg .ava{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:14px;background:var(--surface-2);border:1px solid var(--line)}
  .msg.user .ava{background:var(--accent-soft);border-color:transparent}
  .ai-input{display:flex;gap:9px;align-items:flex-end;padding-top:12px;border-top:1px solid var(--line)}
  .ai-input textarea{min-height:46px;max-height:160px}
  .typing{display:inline-flex;gap:3px} .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .ai-banner{display:flex;gap:9px;align-items:center;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn);padding:9px 13px;border-radius:10px;font-size:13px;margin-bottom:14px}

  /* News */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .news-card{display:flex;flex-direction:column;gap:8px;padding:15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:.12s}
  .news-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .news-card .src{font-size:11px;color:var(--accent-ink);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .news-card a.t{font-size:14px;font-weight:600;line-height:1.35;text-decoration:none}
  .news-card a.t:hover{color:var(--accent)}
  .news-card .dt{font-size:11.5px;color:var(--faint);margin-top:auto}

  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pill{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer}
  .pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .prose{font-size:14px;line-height:1.65}
  .prose h4{margin:14px 0 6px;font-size:13px} .prose ul{margin:6px 0;padding-left:20px} .prose li{margin:3px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;transition:.2s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;z-index:50;width:min(84vw,280px);transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top)}
    .side.open{transform:none}
    .hamb{display:grid}
    /* stack every multi-column grid on phones (beats inline grid-template-columns) */
    .two-col,.grid{grid-template-columns:1fr !important}
    .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;opacity:0;pointer-events:none;transition:.2s}
    .scrim.show{opacity:1;pointer-events:auto}
    .view{padding:16px 15px calc(28px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:max(10px,env(safe-area-inset-top))}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(45%,1fr))}
    .news-grid{grid-template-columns:1fr}
    /* 16px inputs stop iOS from zooming the page on focus */
    input,select,textarea{font-size:16px}
    h1{font-size:19px}
    .btn{min-height:40px}
  }
  @media (display-mode:standalone){
    /* running as an installed app */
    .topbar{padding-top:max(12px,env(safe-area-inset-top))}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">CC</div>
      <div><b>Conway Sales HQ</b><span>Command center</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <img class="avatar" id="meAva" alt="" />
      <div class="who"><b id="meName">Tommy Conway</b><br><span id="meRole">Milliken &amp; Company</span></div>
      <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <div class="topbar">
      <button class="btn ghost hamb" id="hamb" aria-label="Menu">☰</button>
      <div>
        <h1 id="pageTitle">Overview</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="ovl" id="ovl"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Conway Sales HQ — single-file admin SPA (vanilla JS)
   Talks to the Node backend in ../server.js
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,p={},...k)=>{const n=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')n.className=v;else if(a==='html')n.innerHTML=v;else if(a.startsWith('on'))n.addEventListener(a.slice(2),v);else if(v!=null)n.setAttribute(a,v);}k.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));return n;};

/* ---------- API layer ---------- */
const API = {
  async j(url,opts){ const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts}); if(!r.ok){let m;try{m=(await r.json()).error}catch{ m=r.statusText } throw new Error(m||('HTTP '+r.status)); } return r.status===204?null:r.json(); },
  health(){ return this.j('/api/health'); },
  store(){ return this.j('/api/store'); },
  create(c,b){ return this.j('/api/'+c,{method:'POST',body:JSON.stringify(b)}); },
  update(c,id,b){ return this.j(`/api/${c}/${id}`,{method:'PUT',body:JSON.stringify(b)}); },
  remove(c,id){ return this.j(`/api/${c}/${id}`,{method:'DELETE'}); },
  settings(b){ return b? this.j('/api/settings',{method:'PUT',body:JSON.stringify(b)}) : this.j('/api/settings'); },
  news(refresh){ return this.j('/api/news'+(refresh?'?refresh=1':'')); },
  ai(payload){ return this.j('/api/ai',{method:'POST',body:JSON.stringify(payload)}); },
  prep(payload){ return this.j('/api/prep',{method:'POST',body:JSON.stringify(payload)}); },
};

/* ---------- State ---------- */
const S = { deals:[],clients:[],products:[],competitors:[],leads:[],plans:[],intel:[],drafts:[], settings:{}, ai:{configured:false}, route:'overview' };
const COLLS=['deals','clients','products','competitors','leads','plans','intel','drafts'];

/* ---------- Utils ---------- */
const fmtMoney=(n,cur='USD')=>{ if(n==null||n==='')return '—'; const sym={USD:'$',EUR:'€',GBP:'£',CAD:'C$',AUD:'A$'}[cur]||''; const v=Number(n); return sym+(Math.abs(v)>=1000? v.toLocaleString('en-US',{maximumFractionDigits:0}) : v.toLocaleString('en-US',{maximumFractionDigits:0})); };
const fmtNum=n=>Number(n||0).toLocaleString('en-US');
const fmtDate=d=>{ if(!d)return '—'; const x=new Date(d); if(isNaN(x))return d; return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
const relDate=d=>{ if(!d)return ''; const x=new Date(d); if(isNaN(x))return ''; const s=(Date.now()-x)/1e3; const a=Math.abs(s); if(a<3600)return Math.round(s/60)+'m'; if(a<86400)return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; };
const fromNow=d=>{ if(!d)return ''; const days=Math.round((new Date(d)-Date.now())/864e5); if(days<=0)return 'today'; if(days===1)return 'tomorrow'; if(days<7)return 'in '+days+'d'; if(days<30)return 'in '+Math.round(days/7)+'w'; return 'in '+Math.round(days/30)+'mo'; };
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* very small markdown -> html for AI output */
function mdlite(t){
  let h=esc(t);
  h=h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h4>$1</h4>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,m=>'<ul>'+m+'</ul>').replace(/<\/ul>\s*<ul>/g,'');
  h=h.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return '<p>'+h+'</p>';
}

/* deal stages */
const STAGES=['Lead','Qualified','Specified','Proposal','Negotiation','Won','Lost'];

function openModal(title, bodyNode, {okText='Save', onOk, wide}={}){
  const m=$('#modal'); m.innerHTML='';

/* form helper: build fields from spec, return getData() */
function formFrom(fields, data={}){
  const wrap=el('div',{}); const refs={};
  fields.forEach(f=>{
    if(f.row){ const r=el('div',{class:'row'}); f.row.forEach(sub=>{ const{node,get}=oneField(sub,data); refs[sub.k]=get; r.append(node.firstChild? node : node); }); wrap.append(r); return; }
    const{node,get}=oneField(f,data); refs[f.k]=get; wrap.append(node);
  });
  return {node:wrap, get:()=>{const o={};for(const k in refs)o[k]=refs[k]();return o;}};
}
function oneField(f,data){
  const lab=el('div',{class:'lab'},f.label); let inp; const val=data[f.k]??f.def??'';
  if(f.type==='textarea'){ inp=el('textarea',{rows:f.rows||4},val); }
  else if(f.type==='select'){ inp=el('select'); (f.opts||[]).forEach(o=>{const op=el('option',{value:typeof o==='object'?o.v:o},typeof o==='object'?o.t:o); if((typeof o==='object'?o.v:o)==String(val))op.selected=true; inp.append(op);}); }
  else { inp=el('input',{type:f.type||'text',placeholder:f.ph||'',value:val}); }
  const l=el('label',{class:'fld'},lab,inp);
  return {node:l, get:()=> f.type==='number'? (inp.value===''?null:Number(inp.value)) : inp.value };
}

const TOUCH_WARN_DAYS=45;
function daysSince(d){ if(!d) return Infinity; const x=new Date(d); if(isNaN(x)) return Infinity; return Math.floor((Date.now()-x)/864e5); }
VIEWS.followups=(root)=>{
  $('#pageSub').textContent='Who’s gone quiet — and overdue next steps';
  const ranked=S.clients.map(c=>({c,days:daysSince(c.lastTouch)})).sort((a,b)=>b.days-a.days);
  const stale=ranked.filter(r=>r.days>=TOUCH_WARN_DAYS);
  const overdueDeals=S.deals.filter(d=>d.nextDate&&new Date(d.nextDate)<Date.now()&&!['Won','Lost'].includes(d.stage))
    .sort((a,b)=>new Date(a.nextDate)-new Date(b.nextDate));

  const g=el('div',{class:'grid',style:'grid-template-columns:1fr 1fr;gap:16px'});

  const left=card('Contacts to reconnect'); const lb=el('div',{class:'card-b'});

  if(!S.clients.length){ lb.append(emptyBox('🤝','No contacts yet','Add contacts in Clients & A&D to track who needs a touch.')); }
  else if(!stale.length){ lb.append(emptyBox('✅','All current',`Nobody’s gone quiet past ${TOUCH_WARN_DAYS} days. Nice.`)); }

    row.append(el('div',{}, el('div',{style:'font-weight:600'},c.name||c.company||'—'), el('div',{class:'mini muted'},[c.company,c.type,c.region].filter(Boolean).join(' · '))));
    const right=el('div',{style:'display:flex;align-items:center;gap:6px'});
    right.append(el('span',{class:'mini',style:'color:var(--bad);white-space:nowrap'}, days===Infinity?'no touch':days+'d'));
    right.append(el('button',{class:'btn sm ghost',title:'Draft an email',onclick:()=>go('email')},'Email'));
    right.append(el('button',{class:'btn sm ghost',title:'AI meeting prep',onclick:()=>clientPrep(c)},'Prep'));
    right.append(el('button',{class:'btn sm',title:'Mark touched today',onclick:async()=>{ try{ const up=await API.update('clients',c.id,{lastTouch:new Date().toISOString().slice(0,10)}); Object.assign(c,up); go('followups'); renderNav(); toast('Marked touched'); }catch(e){ toast(e.message); } }},'✓'));
    row.append(right); lb.append(row);
  });
  left.append(lb);

  const rt=card('Overdue next steps'); const rb=el('div',{class:'card-b'});
  if(!overdueDeals.length){ rb.append(emptyBox('📅','Nothing overdue','Deal next-steps with a past date show up here.')); }

    row.append(el('div',{}, el('div',{style:'font-weight:600'},d.client||'—'), el('div',{class:'mini muted'},d.next||'Follow up')));
    row.append(el('div',{class:'mini',style:'color:var(--bad);text-align:right;white-space:nowrap'}, fmtDate(d.nextDate)));
    rb.append(row);
  });
  rt.append(rb);

};

    {t:'Verified email & contact enrichment', d:'Auto-append verified work emails and direct dials to every lead so outreach is one click — via a people-data service (Hunter.io ~$34/mo, Apollo, or Clearbit). Today each lead links out to the company site and a LinkedIn people-search instead.'},
    {t:'Spec-tracking & bid alerts', d:'Where Milliken is specified, upcoming bid dates, and substitution risk — so specs don’t quietly die at bid. (Reed/BidClerk-style feed.)'},
    {t:'Email + calendar integration', d:'Log touches automatically, pull meetings into prep, and fire the follow-up surfacer off real activity instead of manual dates. (Google/Microsoft API.)'},
    {t:'CRM sync (Salesforce / Milliken systems)', d:'Two-way sync so this cockpit rides on top of the system of record instead of beside it.'},
  ];
  ROADMAP.forEach(r=>{ b5.append(el('div',{style:'padding:11px 0;border-bottom:1px solid var(--line)'}, el('div',{style:'display:flex;align-items:center;gap:8px'}, chip('Add-on','amber'), el('div',{style:'font-weight:600'},r.t)), el('div',{class:'mini muted',style:'margin-top:4px;line-height:1.5'},r.d))); });
  b5.append(el('p',{class:'mini faint',style:'margin:10px 0 0'},'Each is a next-phase upgrade — say the word and we can wire these in.'));
  c5.append(b5);

  const g=el('div',{class:'grid',style:'gap:16px'}); g.append(c1,c2,c4,c3,c5); root.append(g);
};

/* ============================================================
   Shared UI builders
   ============================================================ */
function kpiRow(items){ const r=el('div',{class:'kpis'}); items.forEach(k=>{ const c=el('div',{class:'kpi'}); c.append(el('div',{class:'k-lab'},k.lab), el('div',{class:'k-val'},k.val), el('div',{class:'k-sub'},k.sub||'')); r.append(c); }); return r; }
function card(title,bodyNode){ const c=el('div',{class:'card'}); c.append(el('div',{class:'card-h'},el('h3',{},title))); if(bodyNode){ if(bodyNode.classList&&bodyNode.classList.contains('card-b'))c.append(bodyNode); else c.append(el('div',{class:'card-b'},bodyNode)); } return c; }
function barRow(label,val,max,valText,subText){ const r=el('div',{class:'bar-row'}); r.append(el('div',{class:'bl'},label), el('div',{class:'bar-track'},el('div',{class:'bar-fill',style:`width:${Math.max(3,val/max*100)}%`})), el('div',{class:'bv'},valText, subText?el('span',{class:'mini muted',style:'margin-left:6px;font-weight:400'},subText):null)); return r; }
function tr(cells,head){ const r=el('tr'); cells.forEach(c=>r.append(el(head?'th':'td',{},c))); return r; }
function td(content,align){ const d=el('td',{}); if(align==='right')d.style.textAlign='right'; d.append(content&&content.nodeType?content:document.createTextNode(content??'')); return d; }
function chip(text,color='gray'){ return el('span',{class:'chip '+color},text); }
function rowActs(onEdit,onDel){ return el('div',{class:'rowacts'}, el('button',{class:'iconbtn',title:'Edit',onclick:onEdit,html:svg(IC.edit,'ic')}), el('button',{class:'iconbtn danger',title:'Delete',onclick:onDel,html:svg(IC.trash,'ic')})); }
function emptyBox(icon,title,sub){ return el('div',{class:'empty'}, el('div',{class:'big'},icon), el('div',{style:'font-weight:600;color:var(--ink)'},title), el('div',{class:'mini',style:'margin-top:4px'},sub||'')); }
function iconLabel(ic,text){ const s=el('span',{style:'display:inline-flex;align-items:center;gap:7px'}); s.innerHTML=svg(IC[ic],'ic'); s.append(text); return s; }
function iconLabelFrag(ic,text){ const s=el('span',{style:'display:inline-flex;align-items:center;gap:7px'}); s.innerHTML=svg(IC[ic],'ic'); s.append(text); return [s]; }
function thinking(){ return el('span',{class:'typing'}, el('i'),el('i'),el('i')); }
function copyBox(text){ const w=el('div',{}); const pre=el('div',{class:'prose',style:'white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13.5px'},text); const bar=el('div',{style:'display:flex;gap:8px;margin-top:9px'}, el('button',{class:'btn sm',onclick:()=>{navigator.clipboard.writeText(text);toast('Copied');}},'Copy'), el('button',{class:'btn sm ghost',onclick:()=>{API.create('drafts',{text,ts:Date.now()}).then(d=>{S.drafts.push(d);toast('Saved to drafts');});}},'Save draft')); w.append(pre,bar); return w; }
function aiBanner(){ return el('div',{class:'ai-banner'}, '⚠️', el('div',{}, el('b',{},'AI not connected. '), 'Add an API key in ', el('a',{href:'#settings',style:'text-decoration:underline',onclick:e=>{e.preventDefault();go('settings');}},'Settings'),' to switch this on.')); }
function aiError(e){ const m=String(e.message||e); const w=el('div',{class:'prose'}); if(/not configured|no .*key|dormant/i.test(m)){ return aiBanner(); } w.append(el('span',{class:'muted'},'⚠️ '+m)); return w; }

/* ---------- system prompt ---------- */
function sysPrompt(withData){
  const p=S.settings.profile||{};
  let s=`You are the private AI sales co-pilot for ${p.name||'Tommy Conway'}, ${p.title||'Global Account Manager'} at ${p.company||'Milliken & Company'}. ${p.bio||''}\nYou help with commercial flooring sales: account strategy, A&D specification selling, email drafting, competitive positioning, and lead gen. Be concrete, practical and concise. Use the user's real context when given. Never invent facts about specific people; when unsure, say so.`;
  s+=`\n\nMILLIKEN PORTFOLIO & POSITIONING (use for grounding): carpet tile (incl. PrintWorks custom print), resilient/LVT, broadloom & rugs, OBEX entrance flooring, HybridFORM, installation + quick-ship. Differentiators: WellBAC cushion backing (up to ~24% less muscle fatigue, acoustics + moisture management, up to ~50% longer life vs hardback), PrintWorks design flexibility; sustainability via M/PACT (carbon-offset tiles), N/XT Life reclamation/second-life, PVC-free, verified Red List Free; design consultation, custom development, installation, reclamation, and CEU training. Sectors: workplace, healthcare, senior living & multifamily, education, government, hospitality. Competitors: Shaw Contract, Patcraft, Mohawk Group, Interface, Tarkett, Mannington.`;
  if(withData){
    const deals=S.deals.filter(d=>!['Won','Lost'].includes(d.stage)).slice(0,25).map(d=>`${d.client} | ${d.stage} | ${fmtMoney(d.value,d.currency)} | ${d.sector||''} | next: ${d.next||'none'}`).join('\n');
    const leads=S.leads.slice(0,15).map(l=>`${l.name||l.company} (${l.status})`).join('; ');
    const rivals=S.competitors.map(r=>r.name).join(', ');
    s+=`\n\nCURRENT CONTEXT (for grounding; do not repeat verbatim):\nOPEN DEALS:\n${deals||'none'}\nLEADS: ${leads||'none'}\nCOMPETITORS TRACKED: ${rivals||'none'}`;
  }
  return s;
}

/* ---------- Theme / sidebar ---------- */
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('cc-theme',t);}catch{} }
$('#themeBtn').addEventListener('click',()=>{ const cur=document.documentElement.getAttribute('data-theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); applyTheme(cur==='dark'?'light':'dark'); });
(function(){ try{ const t=localStorage.getItem('cc-theme'); if(t)applyTheme(t); }catch{} })();
function closeSide(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); }
$('#hamb').addEventListener('click',()=>{ $('#side').classList.add('open'); $('#scrim').classList.add('show'); });
$('#scrim').addEventListener('click',closeSide);

/* ---------- Boot ---------- */
async function boot(){
  renderNav();
  try{
    const h=await API.health(); S.ai=h.ai||{configured:false};
    const store=await API.store();
    COLLS.forEach(c=>{ S[c]=store[c]||[]; });
    S.settings=store.settings||{};
    const prof=S.settings.profile||{};
    $('#meName').textContent=prof.name||'Tommy Conway';
    $('#meRole').textContent=prof.company||'Milliken & Company';
    $('#meAva').src=(S.settings.avatar)||'/tom.jpg';
    $('#meAva').onerror=function(){ this.style.display='none'; };
  }catch(e){
    $('#view').innerHTML=''; $('#view').append(el('div',{class:'empty'}, el('div',{class:'big'},'🔌'), el('div',{style:'font-weight:600;color:var(--ink)'},'Can’t reach the server'), el('div',{class:'mini',style:'margin-top:6px'},e.message+' — is the Node app running?')));
    return;
  }
  let start=(location.hash.slice(1)&&VIEWS[location.hash.slice(1)])?location.hash.slice(1):'overview';
  try{ if(!location.hash && !localStorage.getItem('cc-seen-welcome')){ start='welcome'; localStorage.setItem('cc-seen-welcome','1'); } }catch{}
  go(start);
}
boot();
/* register the service worker so the app can be installed to the home screen */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
</script>
